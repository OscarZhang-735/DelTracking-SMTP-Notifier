[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deltracking-backend"
version = "0.1.0"
description = "Server-side API for DelTracking"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "apscheduler>=3.11,<4.0",
  "argon2-cffi>=25.1,<26.0",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls the real NextSLS endpoint when explicitly enabled"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
include = ["app*"]
